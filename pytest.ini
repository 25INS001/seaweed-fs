[pytest]
# seaweed-fs ships configuration, not code. The contract layer therefore reads
# the config files and asserts the invariants that decide whether the object
# store is world-writable; the live layer probes a running S3 gateway.
#
#   pytest                # config checks only — the CI default
#   pytest --live         # adds probes against a running gateway
testpaths = tests
python_files = test_*.py
python_functions = test_*

markers =
    contract: reads config files; no network
    live: requires a running SeaweedFS S3 gateway (enable with --live)
    fuzz: hostile or unexpected input
    defect: encodes a known-broken behaviour

filterwarnings =
    ignore::DeprecationWarning
